        <div style="color:var(--muted)">last_discovery</div><div class="scalar">${escapeHtml(s.last_discovery || '—')}</div>
        <div style="color:var(--muted)">last_check_time</div><div class="scalar">${escapeHtml(s.last_check_time || '—')}</div>
        <div style="color:var(--muted)">last_post_date</div><div class="scalar">${escapeHtml(s.last_post_date || '—')}</div>
        <div style="color:var(--muted)">daily_stats</div><div class="scalar">${escapeHtml(JSON.stringify(s.daily_stats || {}))}</div>
      </div>
    </div>
  `;
  const lists = STATE_FIELDS_LISTS.map(([key, label]) => {
    const arr = Array.isArray(s[key]) ? s[key] : [];
    const empty = arr.length === 0;
    const items = arr.slice().reverse().map(v => {
      const text = typeof v === 'string' ? v : JSON.stringify(v);
      return `<li>${escapeHtml(text)}</li>`;
    }).join('');
    return `<div class="state-card ${empty ? 'empty' : ''}">
      <h4>${escapeHtml(label)}<span class="count">${arr.length}</span></h4>
      ${empty ? '<div class="scalar">（空）</div>' : `<ul>${items}</ul>`}
    </div>`;
  }).join('');
  const followers = Array.isArray(s.followers_history) ? s.followers_history : [];
  const followersItems = followers.slice().reverse().slice(0, 20).map(e => {
    const dt = `${e.date || ''} ${e.time || ''}`.trim();
    return `<li><span class="mono">${escapeHtml(dt)}</span> · followers=${e.followers ?? '—'}${e.likes != null ? ` · likes=${e.likes}` : ''}</li>`;
  }).join('');
  const followersCard = `<div class="state-card ${followers.length ? '' : 'empty'}">
    <h4>粉丝历史<span class="count">${followers.length}</span></h4>
    ${followers.length ? `<ul>${followersItems}</ul>` : '<div class="scalar">（空）</div>'}
  </div>`;
  return `${scalars}<div style="height:16px"></div><div class="state-grid">${lists}${followersCard}</div>`;
}

/* ─── Tasks ─────────────────────────────────────── */

async function renderTasksTab(body) {
  try {
    const r = await fetch(brainApi('/api/v1/data/tasks?limit=100'));
    const d = await r.json();
    if (!d.ok) throw new Error(d.detail || d.error || '加载失败');
    if (!d.data.length) {
      body.innerHTML = '<div class="data-empty">暂无任务历史</div>';
      return;
    }
    const rows = d.data.map(t => {
      const status = t.status || 'unknown';
      const short = (t.trace_id || '').slice(0, 8);
      return `<tr class="row-click" onclick="openTaskDetail('${escapeHtml(t.trace_id)}')">
        <td class="mono" style="width:88px">${escapeHtml(short)}</td>
        <td class="mono" style="width:150px">${escapeHtml(t.dt || '')}</td>
        <td style="width:100px"><span class="pill-status ${status}">${escapeHtml(status)}</span></td>
        <td class="ellipsis" title="${escapeHtml(t.goal || '')}">${escapeHtml(t.goal || '—')}</td>
        <td class="mono" style="width:100px">${escapeHtml(t.account_id || '')}</td>
      </tr>`;
    }).join('');
    body.innerHTML = `
      <div style="color:var(--muted);font-size:11.5px;margin-bottom:8px">共 ${d.total} 条 · 显示最近 ${d.data.length} 条 · 点行查看详情</div>
      <table class="data-table">
        <thead><tr>
          <th>Trace</th><th>时间</th><th>状态</th><th>目标</th><th>账号</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } catch (e) {
    body.innerHTML = `<div class="data-empty">加载失败：${escapeHtml(String(e.message || e))}</div>`;
  }
}

async function openTaskDetail(traceId) {
  const body = document.getElementById('data-body');
  body.innerHTML = '<div class="data-empty">加载中…</div>';
  try {
    const r = await fetch(brainApi('/api/v1/data/tasks/' + encodeURIComponent(traceId)));
    const d = await r.json();
    if (!d.ok) throw new Error(d.detail || d.error || '加载失败');
    const meta = d.meta || {};
    const metaRow = Object.entries(meta)
      .map(([k, v]) => `<span class="kv"><b>${escapeHtml(k)}</b>${escapeHtml(String(v))}</span>`).join('');
    body.innerHTML = `
      <button class="data-back" onclick="closeTaskDetail()">← 返回列表</button>
      <div style="height:12px"></div>
      <div style="font-weight:600;font-size:14px;margin-bottom:6px;color:var(--text)">Trace <span class="mono" style="color:var(--muted)">${escapeHtml(traceId)}</span></div>
      <div class="task-detail-meta">${metaRow || '<span class="kv">无 frontmatter</span>'}</div>
      <div class="task-detail-body">${escapeHtml(d.body || '（无内容）')}</div>
    `;
  } catch (e) {
    body.innerHTML = `<div class="data-empty">加载失败：${escapeHtml(String(e.message || e))}</div>`;
  }
}

function closeTaskDetail() {
  switchDataTab('tasks');
}

/* ─── Token Usage ─────────────────────────────────────── */

async function renderTokenTab(body) {
  try {
    const r = await fetch(brainApi('/api/v1/data/token_usage/summary?days=14'));
    const d = await r.json();
    if (!d.ok) throw new Error(d.detail || d.error || '加载失败');
    const rows = d.data || [];
    const maxTotal = rows.reduce((m, r) => Math.max(m, r.total), 0) || 1;
    const bars = rows.map(r => {
      const pct = Math.max(2, Math.round(100 * r.total / maxTotal));
      return `<div class="token-row">
        <span class="date">${escapeHtml(r.date)}</span>
        <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
        <span class="num">${r.total.toLocaleString()} · ${r.calls} 次</span>
      </div>`;
    }).join('');
    const grandTotal = rows.reduce((s, r) => s + r.total, 0);
    const grandCalls = rows.reduce((s, r) => s + r.calls, 0);
    const modelBreakdown = aggregateModels(rows);
    const modelList = Object.entries(modelBreakdown)
      .sort((a, b) => b[1] - a[1])
      .map(([m, t]) => `<li><span class="mono" style="color:var(--muted)">${escapeHtml(m)}</span> · ${t.toLocaleString()}</li>`).join('');
    body.innerHTML = `
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start">
        <div>
          <div style="color:var(--muted);font-size:11.5px;margin-bottom:10px">最近 ${d.days} 天</div>
          <div class="token-summary">${bars || '<div class="data-empty">暂无数据</div>'}</div>
        </div>
        <div>
          <div class="state-card">
            <h4>合计</h4>
            <div class="scalar">Total: <b>${grandTotal.toLocaleString()}</b> tokens</div>
            <div class="scalar">Calls: <b>${grandCalls.toLocaleString()}</b></div>
          </div>
          <div style="height:12px"></div>
          <div class="state-card ${modelList ? '' : 'empty'}">
            <h4>按模型</h4>
            ${modelList ? `<ul>${modelList}</ul>` : '<div class="scalar">（暂无）</div>'}
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    body.innerHTML = `<div class="data-empty">加载失败：${escapeHtml(String(e.message || e))}</div>`;
  }
}

function aggregateModels(rows) {
  const out = {};
  for (const r of rows) {
    const ms = r.models || {};
    for (const [m, t] of Object.entries(ms)) {
      out[m] = (out[m] || 0) + t;
    }
  }
  return out;
}

// ESC 关闭 data panel / live fullscreen
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('data-overlay').classList.contains('show')) {
    closeDataPanel();
  } else if (document.getElementById('live-fullscreen').classList.contains('show')) {
    closeLiveFullscreen();
  }
});

/* ═══════════════════ Live 全屏 ═══════════════════ */

function openLiveFullscreen() {
  const acct = state.activeId || 'default';
  const entry = state.liveCache.get(acct);
  const body = document.getElementById('live-fs-body');
  const info = document.getElementById('live-fs-info');
  body.innerHTML = '';
  if (entry && entry.iframe) {
    // 直接把缓存的 iframe 节点**移动**过来（不新建，避免连接两个终端触发阿里 2002 冲突）
    body.appendChild(entry.iframe);
  } else {
    const rt = state.runtime;
    const url = rt && rt.agentbay && rt.agentbay.live_view_url;
    if (url) {
      const ifr = document.createElement('iframe');
      ifr.src = url;
      body.appendChild(ifr);
    } else {
      body.innerHTML = '<div style="margin:auto;color:var(--muted);padding:40px">该 worker 尚未建立云端 session</div>';
    }
  }
  const rt = state.runtime;
  info.textContent = rt && rt.agentbay
    ? `${acct} · ${rt.agentbay.platform || 'mobile'} · ${(rt.agentbay.screen_size || {}).width || '?'}×${(rt.agentbay.screen_size || {}).height || '?'}`
    : acct;
  document.getElementById('live-fullscreen').classList.add('show');
}

function closeLiveFullscreen() {
  // 关闭时把 iframe 节点**移回**原来的 live-body，继续共享同一个流连接
  const fs = document.getElementById('live-fullscreen');
  const fsBody = document.getElementById('live-fs-body');
  const ifr = fsBody.querySelector('iframe');
  if (ifr) {
    const acct = state.activeId || 'default';
    const entry = state.liveCache.get(acct);
    const liveBody = document.getElementById('live-body');
    if (entry && entry.iframe === ifr && liveBody) {
      liveBody.appendChild(ifr);
      // 只保留当前 iframe 可见（LRU 的其他隐藏项保持原状）
      ifr.style.display = 'block';
    } else {
      // 非缓存 iframe（一次性那种）直接扔
      ifr.remove();
    }
  }
  fsBody.innerHTML = '';
  fs.classList.remove('show');
}
</script>

<!-- Data 面板 overlay（默认隐藏）-->
<div class="data-overlay" id="data-overlay" onclick="if(event.target===this)closeDataPanel()">
  <div class="data-panel">
    <div class="data-head">
      <span class="title">数据管理</span>
      <span class="grow"></span>
      <button class="close" onclick="closeDataPanel()" title="关闭">×</button>
    </div>
    <div class="data-tabs">
      <button class="tab active" data-tab="state" onclick="switchDataTab('state')">Agent State</button>
      <button class="tab" data-tab="tasks" onclick="switchDataTab('tasks')">Tasks</button>
      <button class="tab" data-tab="token" onclick="switchDataTab('token')">Token Usage</button>
    </div>
    <div class="data-body" id="data-body"></div>
  </div>
</div>
